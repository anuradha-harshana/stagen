version: '3.8'

services:
  # 1. Custom WSO2 Identity Server Service
  wso2is:
    image: manujagma/wso2-custom-auth:v1
    container_name: wso2is-app
    ports:
      - "9443:9443"
    networks:
      - app-network

  # 2. Next.js Development Service
  next-app:
    image: node:22-alpine
    container_name: nextjs-app
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      APP_URL: http://localhost:3000
      CHOKIDAR_USEPOLLING: "true"
      # Add your WSO2 client credentials here if needed
      WSO2_BASE_URL: https://localhost:9443
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev"
    depends_on:
      - wso2is
    networks:
      - app-network

networks:
  app-network:
    driver: bridge